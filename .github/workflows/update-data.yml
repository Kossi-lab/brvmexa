# Mise à jour automatique des données BRVMexa.
# - Jours ouvrés, pendant la séance (9h-15h GMT) : toutes les 15 minutes
# - Jours ouvrés, avant et après la séance (8h, 16h-22h GMT) : toutes les heures
# - Week-end : actualités toutes les 4 heures
# Les fichiers de /data sont commités dans le dépôt ; l'application les lit en ligne.
name: Mise à jour des données

on:
  schedule:
    - cron: '2,17,32,47 9-15 * * 1-5'
    - cron: '7 8,16-22 * * 1-5'
    - cron: '17 */4 * * 0,6'
  workflow_dispatch:
    inputs:
      task:
        description: 'Tâche à lancer'
        type: choice
        default: update
        options: [update, backfill]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - run: npm ci

      - name: Collecte (cours, indices, actualités)
        if: github.event_name == 'schedule' || inputs.task == 'update'
        # Le week-end, seules les actualités changent
        run: |
          if [ "$(date -u +%u)" -ge 6 ]; then npm run update -- news; else npm run update; fi

      - name: Alertes de cours (notifications push)
        if: github.event_name == 'schedule' || inputs.task == 'update'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run alerts

      - name: Historique des cours (une seule fois)
        if: inputs.task == 'backfill'
        run: npm run backfill

      - name: Publication des données
        if: always()
        working-directory: .
        run: |
          git config user.name "brvmexa-bot"
          git config user.email "brvmexa-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données BRVM $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

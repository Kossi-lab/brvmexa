# Mise à jour automatique des données BRVMexa.
# - Jours ouvrés, pendant la séance (9h-15h GMT) : toutes les 15 minutes
# - Jours ouvrés, avant et après la séance (8h, 16h-22h GMT) : toutes les heures
# - Week-end : actualités toutes les 4 heures
# Les fichiers de /data sont commités dans le dépôt ; l'application les lit en ligne.
name: Mise à jour des données

on:
  schedule:
    - cron: '2,17,32,47 9-15 * * 1-5'
    - cron: '7 8,16-22 * * 1-5'
    - cron: '17 */4 * * 0,6'
  workflow_dispatch:
    inputs:
      task:
        description: 'Tâche à lancer'
        type: choice
        default: update
        options: [update, backfill]

permissions:
  contents: write
  actions: write   # relancer la mise en ligne du site après publication (audit A-09)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      # --ignore-scripts : aucun paquet npm n'exécute de code à l'installation
      - run: npm ci --ignore-scripts

      - name: Collecte (cours, indices, actualités)
        if: github.event_name == 'schedule' || inputs.task == 'update'
        # Le week-end, seules les actualités changent
        env:
          # IA qui réécrit les actualités : clé Google Gemini gratuite (GEMINI_API_KEY).
          # À défaut, une clé ANTHROPIC_API_KEY (payante). Sans clé, les dépêches sont publiées telles quelles.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$(date -u +%u)" -ge 6 ]; then npm run update -- news; else npm run update; fi

      - name: Alertes de cours (notifications push)
        if: github.event_name == 'schedule' || inputs.task == 'update'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        # Sécurité : la clé secrète n'est jamais donnée à un paquet npm.
        # Le script des alertes n'utilise que Node ; les paquets sont mis de côté pendant son exécution.
        run: |
          mv node_modules "$RUNNER_TEMP/nm"
          set +e
          node src/alerts.mjs
          code=$?
          mv "$RUNNER_TEMP/nm" node_modules
          exit $code

      - name: Historique des cours (une seule fois)
        if: inputs.task == 'backfill'
        run: npm run backfill

      - name: Publication des données
        id: publication
        if: always()
        working-directory: .
        run: |
          git config user.name "brvmexa-bot"
          git config user.email "brvmexa-bot@users.noreply.github.com"
          git add data docs/actualites docs/actions docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Données BRVM $(date -u +'%Y-%m-%d %H:%M') UTC"
            # Jusqu'à 3 essais : si un autre commit est arrivé entre-temps, nos données (les plus récentes) l'emportent
            for i in 1 2 3; do
              if git pull --rebase -X theirs --autostash && git push; then echo "publie=1" >> "$GITHUB_OUTPUT"; exit 0; fi
              git rebase --abort 2>/dev/null || true
              echo "Publication : essai $i échoué, nouvel essai dans 10 s"; sleep 10
            done
            exit 1
          fi

      # Pendant la séance, le direct (cours toutes les 30 s) doit tourner : on le relance s'il est arrêté
      - name: Vérifier que le direct tourne
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(date -u +%H%M); j=$(date -u +%u)
          if [ "$j" -le 5 ] && [ "$h" -ge 0850 ] && [ "$h" -lt 1525 ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/direct.yml/runs?per_page=10" --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
            if [ "${n:-0}" = 0 ]; then echo "Direct arrêté : relance."; gh workflow run direct.yml --ref main; else echo "Direct en cours."; fi
          fi

      # Les commits du robot ne déclenchent pas les workflows : on lance la mise en ligne du site
      - name: Mise en ligne du site et des données
        if: always() && steps.publication.outputs.publie == '1'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

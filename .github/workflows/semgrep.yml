name: Analyse de sécurité du code (Semgrep)
on:
  push:
    paths: ['scraper/**', 'docs/assets/js/**', '.github/workflows/**', '.semgrepignore']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Installer Semgrep
        run: pip install --quiet semgrep==1.187.0
      - name: Analyser (rapport complet)
        run: semgrep scan --config p/javascript --config p/github-actions --config p/secrets --config p/xss --metrics=off --sarif -o "$RUNNER_TEMP/semgrep.sarif" .
      - name: Envoyer le rapport dans l'onglet Sécurité
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep
      - name: Bloquer sur les problèmes graves
        # innerHTML du site : revu le 27/11/2026, tout contenu externe passe par esc()
        run: >
          semgrep scan --config p/javascript --config p/github-actions --config p/secrets --metrics=off --severity ERROR --error
          --exclude-rule javascript.browser.security.insecure-document-method.insecure-document-method
          --exclude-rule javascript.browser.security.insecure-innerhtml.insecure-innerhtml .
